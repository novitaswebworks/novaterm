name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Release tag name (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN || secrets.GITHUB_TOKEN }}
          # Updater signing — store private key + password as repo secrets:
          #   TAURI_SIGNING_PRIVATE_KEY  → base64-encoded .key file content
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD → key password
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + notarization (commented until certs are set up)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tagName || github.ref_name }}
          releaseName: "NovaTerm ${{ inputs.tagName || github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}



      - name: Submit to Winget (Windows Only)
        if: matrix.platform == 'windows-latest'
        uses: vedantmgoyal2009/winget-releaser@v2
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        with:
          identifier: NovitasWebWorks.NovaTerm
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: novitaswebworks
          release-repository: novaterm
          release-tag: ${{ inputs.tagName || github.ref_name }}

  # ─────────────────────────────────────────────────────────────────────────
  # After ALL platform builds succeed, ping the website repo so it can
  # auto-update the VERSION, download links, and changelog.
  # Requires a secret: WEBSITE_DEPLOY_TOKEN
  #   → a GitHub Personal Access Token (classic) with "repo" scope scoped
  #     to the novaterm-website repo, stored as a secret in THIS repo.
  # ─────────────────────────────────────────────────────────────────────────
  notify-website:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version and release notes
        id: meta
        run: |
          TAG="${{ inputs.tagName || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          NOTES=$(node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            try {
              const text = fs.readFileSync("CHANGELOG.md", "utf8");
              const lines = text.split("\n");
              let capturing = false;
              const out = [];
              for (const line of lines) {
                if (line.startsWith("## ")) {
                  if (line.includes(ver)) {
                    capturing = true;
                    continue;
                  } else if (capturing) {
                    break;
                  }
                }
                if (capturing) {
                  out.push(line);
                }
              }
              console.log(out.join("\n").trim());
            } catch (e) {
              console.log("");
            }
          ' "$VERSION")

          if [ -n "$NOTES" ]; then
            gh release edit "$TAG" --notes "$NOTES" || true
          else
            NOTES=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
              | jq -r '.body // ""')
          fi

          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES"    >> "$GITHUB_OUTPUT"
          echo "EOF"       >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch app-released to website repo
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/novaterm-website/dispatches" \
            --data '{
              "event_type": "app-released",
              "client_payload": {
                "version": "${{ steps.meta.outputs.VERSION }}",
                "notes": ${{ toJSON(steps.meta.outputs.NOTES) }}
              }
            }'
          echo "Done - dispatched app-released v${{ steps.meta.outputs.VERSION }} to website"

      - name: Dispatch app-released to homebrew-tap repo
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/homebrew-tap/dispatches" \
            --data '{
              "event_type": "app-released",
              "client_payload": {
                "version": "${{ steps.meta.outputs.VERSION }}"
              }
            }'
          echo "Done - dispatched app-released v${{ steps.meta.outputs.VERSION }} to homebrew-tap"
