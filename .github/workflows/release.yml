name: "Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization. Without these the app
          # ships ad-hoc signed: Gatekeeper flags it "unidentified developer"
          # and, because ad-hoc signatures have no stable Team ID, macOS TCC
          # cannot remember folder-access grants across releases, so users
          # get re-prompted for Desktop/Documents/Downloads on every update.
          # No-ops on non-macOS runners. See CONTRIBUTING.md / repo secrets
          # for how to populate these.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NovaTerm ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

  # ─────────────────────────────────────────────────────────────────────────
  # After ALL platform builds succeed, ping the website repo so it can
  # auto-update the VERSION, download links, and changelog.
  # Requires a secret: WEBSITE_DEPLOY_TOKEN
  #   → a GitHub Personal Access Token (classic) with "repo" scope scoped
  #     to the novaterm-website repo, stored as a secret in THIS repo.
  # ─────────────────────────────────────────────────────────────────────────
  notify-website:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: meta
        run: |
          VERSION="${{ github.ref_name }}"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch release notes from GitHub API
        id: notes
        run: |
          NOTES=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | jq -r '.body // ""')
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES"    >> "$GITHUB_OUTPUT"
          echo "EOF"       >> "$GITHUB_OUTPUT"

      - name: Dispatch app-released to website repo
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/novitaswebworks/novaterm-website/dispatches" \
            --data '{
              "event_type": "app-released",
              "client_payload": {
                "version": "${{ steps.meta.outputs.VERSION }}",
                "notes": ${{ toJSON(steps.notes.outputs.NOTES) }}
              }
            }'
          echo "Done - dispatched app-released v${{ steps.meta.outputs.VERSION }} to website"
